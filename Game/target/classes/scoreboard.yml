# Настройки таба
groups:
  sradmin:
    prefix: "&4[Гл.Админ] &f"
    suffix: ""
  curator:
    prefix: "&d[Куратор] &f"
    suffix: ""
  admin:
    prefix: "&c[Админ] &f"
    suffix: ""
  default:
    prefix: "&7[Игрок] &f"
    suffix: ""

tab-settings:
  enabled: true
  update-interval: 20  # тиков (1 секунда)
  player-format: "@prefix @player @suffix"

  header:
    - ""
    - "&l&b▪ &#0300FFF&#1D1AFCo&#3834F8u&#524EF5r&#6D68F1C&#8782EEu&#A29CEAb&#BCB6E7e &b▪"
    - "&eРежим: &dБоксовое ПВП"
    - "&eОнлайн режима: &d@online"
    - ""

  footer:
    - "  "
    - "&fТелеграм: &et.me/FourCube"
    - "&fСайт: &efourcube.ru"
    - "&fVK: &evk.com/fourcube"
    - "&fDiscord: &eds.gg"

# Настройки скорборда
scoreboard:
  enabled: true
  rotation-enabled: true
  rotation-interval: 200  # тиков (10 секунд)
  update-interval: 20     # тиков (1 секунда)

# Список бордов
boards:
  profile:
    title: "&#b866ffFourCube.ru"
    stay: 10
    priority: 1
    lines:
      - ""
      - " &#b866ffИгровой профиль   "
      - "  &fИгровой ник:           "
      - "  &fСтатус:                "
      - "  &fТитул:                 "
      - ""
      - " &#b866ffКошелёк           "
      - "  &fМонеты: &#b866ff1000   "
      - "  &fКубики: &#b866ff500    "
      - ""

  info:
    title: "&dИнформация"
    stay: 10
    priority: 0
    lines:
      - "&e⇄Пинг <ping>"
      - "&4💀Смерти <player_death>"
      - "&c🗡Убийства <player_kills>"
      - "&e🕐Наиграно <player_playtime>"
      - ""
      - "&fПутеводитель &e/menu"
      - "&fНаши соц. сети &e/link"